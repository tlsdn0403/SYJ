syntax = "proto3";
package Protocol;

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_CREATURE = 1;		// 유저, 좀비
	OBJECT_TYPE_PROJECTILE = 2;		// 총알, 날라가는 투사체
	OBJECT_TYPE_ITEM = 3;			// 바닥에 있는 아이템
}

enum CreatureType
{
	CREATURE_TYPE_NONE = 0;
	CREATURE_TYPE_PLAYER = 1;
	CREATURE_TYPE_ZOMBIE = 2;
}

enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_SHOOTER = 1;
}

enum ZombieType
{
	ZOMBIE_TYPE_NONE = 0;
	ZOMBIE_TYPE_MELEE = 1;
	ZOMBIE_TYPE_RANGED = 2;
	ZOMBIE_TYPE_TANKER = 3;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN = 2;
	MOVE_STATE_JUMP = 3;
	MOVE_STATE_FALL = 4;	// 점프 후 떨어질때 
	MOVE_STATE_DEAD = 6;
}

enum WeaponType
{
	WEAPON_TYPE_NONE = 0;
	WEAPON_TYPE_RIFLE = 1;
}

enum TruckSeatType
{
	TRUCK_SEAT_NONE = 0;
	TRUCK_SEAT_DRIVER = 1;
	TRUCK_SEAT_CARGO = 2;
	TRUCK_SEAT_TURRET = 3;
}