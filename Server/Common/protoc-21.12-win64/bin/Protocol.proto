syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string nickname = 1;
}

message S_LOGIN
{
	bool success = 1;
	repeated ObjectInfo players = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{
}

message S_LEAVE_GAME
{
	uint64 object_id = 1;
}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated DespawnInfo despawn_infos = 1;
}

message C_MOVE
{
	PosInfo info = 1;
}

message S_MOVE
{
	PosInfo info = 1;
}

message C_HIT_ZOMBIE
{
	uint64 zombie_id = 1;
	uint64 attacker_id = 2;
	float damage = 3;
	float hit_x = 4;
	float hit_y = 5;
	float hit_z = 6;
}

message S_ZOMBIE_ATTACK
{
	uint64 zombie_id = 1;
	uint64 target_player_id = 2;
}

message S_ZOMBIE_HP
{
	uint64 zombie_id = 1;
	float hp = 2;
	float max_hp = 3;
}

message S_ZOMBIE_DIE
{
	uint64 zombie_id = 1;
	uint64 killer_id = 2;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_EQUIP_WEAPON
{
	uint64 itemObjectId = 1;
}

message C_PICKUP_LOOT_ITEM
{
	uint64 item_object_id = 1;
	bool should_respawn = 2;
	float respawn_delay = 3;
}

message S_EQUIP_WEAPON
{
	uint64 playerId = 1;
	uint64 itemObjectId = 2;
	int32 weaponType = 3;
}

message S_SPAWN_ITEM
{
	repeated ObjectInfo items = 1;
}

message C_FIRE
{
}

message S_FIRE
{
	uint64 object_id = 1;
}

message C_ENTER_TRUCK
{
	uint64 truck_id = 1;
	TruckSeatType seat_type = 2;
}

message S_ENTER_TRUCK
{
	uint64 player_id = 1;
	uint64 truck_id = 2;
	TruckSeatType seat_type = 3;
}

message C_EXIT_TRUCK
{

}

message S_EXIT_TRUCK
{
	uint64 player_id = 1;
	uint64 truck_id = 2;
	TruckSeatType seat_type = 3;
}

message C_TRUCK_MOVE
{
	PosInfo info = 1;
}

message S_TRUCK_MOVE
{
	PosInfo info = 1;
}

message C_LOAD_TRUCK_ITEM
{
	uint64 truck_id = 1;
	repeated int32 item_types = 2;
}

message S_LOAD_TRUCK_ITEM
{
	uint64 player_id = 1;
	uint64 truck_id = 2;
	repeated int32 item_types = 3;
}

message C_TOGGLE_DOOR
{
	uint64 door_id = 1;
}

message S_TOGGLE_DOOR
{
	uint64 door_id = 1;
	bool is_open = 2;
}

message S_ENTER_GAME_READY_COUNT
{
	int32 ready_count = 1;
	int32 required_count = 2;
}

message S_STAGE_TIMER
{
	int32 remaining_seconds = 1;
	bool is_loading_phase = 2;
}

message S_STAGE1_ITEM_SEED
{
	uint32 seed = 1;
}

message S_RESPAWN_LOOT_ITEM
{
	repeated uint64 item_object_ids = 1;
}

message C_STAGE_TRANSITION_REQUEST
{
  uint64 truck_id = 1;
  string target_level = 2;
}

message S_STAGE_TRANSITION
{
  string target_level = 1;
}