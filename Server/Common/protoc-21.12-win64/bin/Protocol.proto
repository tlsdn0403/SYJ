syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
	repeated ObjectInfo players = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
}

message S_MOVE
{
	PosInfo info = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message C_EQUIP_WEAPON
{
	uint64 itemObjectId = 1; 
}

message S_EQUIP_WEAPON
{
	uint64 playerId = 1;       // 누가 주웠는지 (이 사람 손에 총을 붙여야 함)
	uint64 itemObjectId = 2;   // 맵에 떨어져 있던 어떤 아이템을 주웠는지 (주웠으니 맵에서 지워야 함)
	int32 weaponType = 3;      // 그 아이템이 무슨 총인지 (어떤 모델링을 띄울지 결정)
}