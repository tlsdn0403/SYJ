syntax = "proto3";
package Protocol;

import "Enum.proto";

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
	float yaw = 5;
	MoveState state = 6;
	float pitch = 7;
	float roll = 8;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
	int32 weapon_type = 4;
	string nickname = 5;
}

message DespawnInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
}
